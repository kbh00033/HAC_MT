<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>퀴즈 게임 점수판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            touch-action: manipulation;
        }
        input {
            user-select: auto;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen w-full overflow-hidden font-sans relative">

    <!-- ================= SETUP PAGE (팀 이름 설정) ================= -->
    <div id="setup-page" class="h-full flex flex-col p-6 bg-white overflow-y-auto z-20 absolute inset-0 hidden">
        <div class="mb-8 mt-4 text-center">
            <h1 class="text-3xl font-black text-gray-800 mb-2">팀 이름 설정</h1>
            <p class="text-gray-500 text-sm">6개 팀의 이름을 입력해 주세요.</p>
        </div>

        <div class="flex-grow space-y-4" id="team-inputs-container">
            <!-- JS로 입력창 생성됨 -->
        </div>

        <div class="mt-6 mb-4">
            <button onclick="startGame()" class="w-full bg-blue-600 text-white font-black text-xl py-4 rounded-xl shadow-lg active:bg-blue-700 transition-colors">
                게임 시작
            </button>
        </div>
    </div>

    <!-- ================= GAME PAGE (메인 점수판) ================= -->
    <div id="game-page" class="hidden h-full flex flex-col w-full absolute inset-0">
        
        <!-- 상단 헤더 및 라운드 네비게이션 -->
        <header class="bg-white shadow-md z-10 flex-shrink-0">
            <!-- 최상단 유틸리티 (팀 이름 재설정) -->
            <div class="flex justify-end px-3 py-1 bg-gray-50 border-b border-gray-200">
                <button onclick="resetGame()" class="text-xs font-bold text-gray-500 hover:text-red-500 flex items-center">
                    <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    게임 전체 초기화 (이름 재설정)
                </button>
            </div>

            <div class="px-2 py-2">
                <!-- 3x2 그리드 라운드 탭 -->
                <div id="round-tabs" class="grid grid-cols-3 gap-1.5 mb-2">
                    <!-- JS로 라운드 탭 생성됨 -->
                </div>
                
                <!-- 벌칙/우승 확인 버튼 영역 -->
                <div id="action-container" class="h-10 flex justify-center items-center">
                    <button id="action-btn" class="hidden w-full h-full text-base font-bold rounded-lg shadow transition-colors duration-200" onclick="handleAction()">
                        동작 버튼
                    </button>
                </div>
            </div>
        </header>

        <!-- 점수판 그리드 (2x3) -->
        <main class="flex-grow p-2 overflow-y-auto pb-6">
            <div id="teams-grid" class="grid grid-cols-2 gap-3 h-full">
                <!-- JS로 팀 카드 생성됨 -->
            </div>
        </main>
    </div>

    <!-- ================= POPUP MODAL ================= -->
    <div id="modal" class="fixed inset-0 bg-black bg-opacity-70 hidden flex justify-center items-center z-50 px-4">
        <div class="bg-white rounded-2xl w-full max-w-sm p-6 text-center transform scale-95 transition-transform duration-200" id="modal-content">
            <h2 id="modal-title" class="text-3xl font-black mb-4">타이틀</h2>
            <div id="modal-body" class="text-xl font-bold mb-6 text-gray-700">내용</div>
            <button class="bg-gray-800 text-white w-full py-3 rounded-lg text-lg font-bold active:bg-gray-900" onclick="closeModal()">확인</button>
        </div>
    </div>

    <script>
        const NUM_TEAMS = 6;
        const NUM_ROUNDS = 6;
        const roundNames = ['애니', '캐릭터', '명대사', '연상', 'OST', '엑스트라'];
        
        let teamNames = ['1팀', '2팀', '3팀', '4팀', '5팀', '6팀'];
        let currentRound = 1;
        let scoreData = Array.from({ length: NUM_ROUNDS + 1 }, () => Array(NUM_TEAMS + 1).fill(0));

        // UI 요소 참조
        const setupPage = document.getElementById('setup-page');
        const gamePage = document.getElementById('game-page');
        const teamInputsContainer = document.getElementById('team-inputs-container');
        const roundTabsContainer = document.getElementById('round-tabs');
        const teamsGrid = document.getElementById('teams-grid');
        const actionBtn = document.getElementById('action-btn');
        
        const modal = document.getElementById('modal');
        const modalContent = document.getElementById('modal-content');
        const modalTitle = document.getElementById('modal-title');
        const modalBody = document.getElementById('modal-body');

        // [LocalStorage 데이터 저장/불러오기 기능]
        function saveData() {
            const data = {
                teamNames,
                currentRound,
                scoreData
            };
            localStorage.setItem('quizGameState', JSON.stringify(data));
        }

        function loadData() {
            const saved = localStorage.getItem('quizGameState');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    teamNames = data.teamNames || teamNames;
                    currentRound = data.currentRound || 1;
                    scoreData = data.scoreData || scoreData;
                    return true;
                } catch (e) {
                    console.error("데이터 로드 실패", e);
                }
            }
            return false;
        }

        // 전체 게임 초기화
        function resetGame() {
            if (confirm("모든 점수와 설정이 삭제됩니다. 처음부터 다시 시작하시겠습니까?")) {
                localStorage.removeItem('quizGameState');
                location.reload();
            }
        }

        // 앱 시작 진입점
        function initApp() {
            if (loadData()) {
                setupPage.classList.add('hidden');
                gamePage.classList.remove('hidden');
                initGame();
            } else {
                setupPage.classList.remove('hidden');
                gamePage.classList.add('hidden');
                initSetup();
            }
        }

        // 설정 페이지 렌더링
        function initSetup() {
            teamInputsContainer.innerHTML = '';
            for (let i = 0; i < NUM_TEAMS; i++) {
                const wrapper = document.createElement('div');
                wrapper.className = "flex items-center space-x-3 bg-gray-50 p-3 rounded-lg border border-gray-200";
                wrapper.innerHTML = `
                    <label class="font-bold text-gray-500 w-8 flex-shrink-0">${i+1}팀</label>
                    <input type="text" id="team-input-${i}" placeholder="${i+1}팀 이름을 입력하세요" value="${teamNames[i]}" 
                           class="flex-grow bg-transparent font-bold text-gray-800 text-lg outline-none w-full">
                `;
                teamInputsContainer.appendChild(wrapper);
            }
        }

        // 게임 시작
        function startGame() {
            for (let i = 0; i < NUM_TEAMS; i++) {
                const inputVal = document.getElementById(`team-input-${i}`).value.trim();
                if (inputVal) {
                    teamNames[i] = inputVal;
                }
            }
            saveData();
            setupPage.classList.add('hidden');
            gamePage.classList.remove('hidden');
            initGame();
        }

        // 게임 화면 초기화
        function initGame() {
            renderTabs();
            renderTeams();
            updateActionState();
        }

        function renderTabs() {
            roundTabsContainer.innerHTML = '';
            for (let i = 1; i <= NUM_ROUNDS; i++) {
                const isActive = (i === currentRound);
                const btn = document.createElement('button');
                btn.className = `py-2 px-1 rounded-lg text-sm font-bold border transition-colors flex items-center justify-center truncate ${
                    isActive ? 'bg-blue-600 text-white border-blue-600 shadow-md' : 'bg-gray-50 text-gray-500 border-gray-200 active:bg-gray-200'
                }`;
                btn.innerHTML = `<span class="opacity-75 mr-1 text-xs">${i}R</span> <span class="truncate">${roundNames[i-1]}</span>`;
                btn.onclick = () => setRound(i);
                roundTabsContainer.appendChild(btn);
            }
        }

        function renderTeams() {
            teamsGrid.innerHTML = '';
            for (let i = 1; i <= NUM_TEAMS; i++) {
                const totalScore = calculateTotalScore(i);
                const teamName = teamNames[i-1];
                
                let currentDisplayScore = scoreData[currentRound][i];
                let roundText = roundNames[currentRound-1];

                // [요구사항 반영] 4라운드와 5라운드는 현재 점수를 서로 합산하여 표시
                if (currentRound === 4 || currentRound === 5) {
                    currentDisplayScore = scoreData[4][i] + scoreData[5][i];
                    roundText = '4R+5R 합산';
                }

                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow border-2 border-gray-200 flex flex-col justify-between p-2";
                card.innerHTML = `
                    <div class="mb-1">
                        <div class="text-center font-black text-gray-800 text-base mb-0.5 truncate">${teamName}</div>
                        <div class="text-center text-[10px] font-semibold text-gray-400">누적 총점</div>
                        <div class="text-center text-4xl font-black text-blue-700 mb-1 leading-none tracking-tighter">${totalScore}</div>
                        <div class="text-center text-xs font-bold ${currentDisplayScore > 0 ? 'text-green-600' : 'text-gray-500'} bg-gray-50 py-0.5 rounded">
                            ${roundText}: <span class="text-sm">${currentDisplayScore}</span>
                        </div>
                    </div>
                    <div>
                        <div class="grid grid-cols-2 gap-1 mb-1">
                            <button class="bg-blue-50 text-blue-700 border border-blue-200 font-black py-2 rounded text-base active:bg-blue-200 shadow-sm" onclick="addScore(${i}, 10)">+10</button>
                            <button class="bg-blue-600 text-white font-black py-2 rounded text-base active:bg-blue-700 shadow-sm" onclick="addScore(${i}, 20)">+20</button>
                        </div>
                        <div class="grid grid-cols-2 gap-1">
                            <button class="bg-gray-100 text-gray-600 font-bold py-1 rounded text-xs active:bg-gray-300" onclick="addScore(${i}, -10)">-10</button>
                            <button class="bg-gray-100 text-gray-600 font-bold py-1 rounded text-xs active:bg-gray-300" onclick="addScore(${i}, -20)">-20</button>
                        </div>
                    </div>
                `;
                teamsGrid.appendChild(card);
            }
        }

        function setRound(round) {
            currentRound = round;
            saveData();
            renderTabs();
            renderTeams();
            updateActionState();
        }

        function addScore(team, amount) {
            // [요구사항 반영] 4, 5라운드는 점수를 공유하므로 감점 시 연동 처리
            if (currentRound === 4 || currentRound === 5) {
                scoreData[currentRound][team] += amount;
                
                // 음수가 될 경우 다른 라운드(4R<->5R)에서 차감하여 논리적 오류 방지
                if (scoreData[currentRound][team] < 0) {
                    let remainder = scoreData[currentRound][team];
                    scoreData[currentRound][team] = 0;
                    
                    let otherRound = (currentRound === 4) ? 5 : 4;
                    scoreData[otherRound][team] += remainder;
                    if (scoreData[otherRound][team] < 0) scoreData[otherRound][team] = 0;
                }
            } else {
                scoreData[currentRound][team] += amount;
                if (scoreData[currentRound][team] < 0) scoreData[currentRound][team] = 0;
            }
            
            saveData();
            renderTeams();
        }

        function calculateTotalScore(team) {
            let total = 0;
            for (let r = 1; r <= NUM_ROUNDS; r++) {
                total += scoreData[r][team];
            }
            return total;
        }

        function updateActionState() {
            actionBtn.className = "w-full h-full text-base font-black rounded-lg shadow-sm transition-colors duration-200"; 
            
            // [요구사항 반영] 4라운드는 벌칙이 없으므로 버튼을 숨깁니다.
            if (currentRound === 1 || currentRound === 2 || currentRound === 3 || currentRound === 5) {
                actionBtn.classList.remove('hidden');
                actionBtn.classList.add('bg-red-500', 'text-white', 'active:bg-red-600', 'animate-pulse');
                actionBtn.innerText = `🚨 ${currentRound}R 벌칙 팀 확인`;
            } else if (currentRound === 6) {
                actionBtn.classList.remove('hidden');
                actionBtn.classList.add('bg-yellow-400', 'text-yellow-900', 'active:bg-yellow-500');
                actionBtn.innerText = `🏆 최종 우승 결과 보기`;
            } else {
                actionBtn.classList.add('hidden'); // 4라운드는 버튼 없음
            }
        }

        function handleAction() {
            const totals = [];
            for (let i = 1; i <= NUM_TEAMS; i++) {
                totals.push({ teamIndex: i, name: teamNames[i-1], score: calculateTotalScore(i) });
            }

            if (currentRound === 1 || currentRound === 2 || currentRound === 3 || currentRound === 5) {
                const minScore = Math.min(...totals.map(t => t.score));
                const penaltyTeams = totals.filter(t => t.score === minScore).map(t => t.name);
                
                showModal('💀 벌칙 당첨', `현재 누적 최하점 (${minScore}점)<br><br><span class="text-4xl font-black text-red-600 break-keep leading-tight">${penaltyTeams.join(', ')}</span><br><br>벌칙을 수행하세요!`, 'bg-red-50');
            } else if (currentRound === 6) {
                const maxScore = Math.max(...totals.map(t => t.score));
                const winTeams = totals.filter(t => t.score === maxScore).map(t => t.name);
                
                showModal('🏆 최종 우승', `최종 누적 최고점 (${maxScore}점)<br><br><span class="text-4xl font-black text-yellow-600 break-keep leading-tight">${winTeams.join(', ')}</span><br><br>우승을 축하합니다!`, 'bg-yellow-50');
            }
        }

        function showModal(title, bodyHTML, bgColorClass) {
            modalTitle.innerText = title;
            modalBody.innerHTML = bodyHTML;
            modalContent.className = `bg-white rounded-2xl w-full max-w-sm p-6 text-center transform scale-100 transition-transform duration-200 border-4 ${bgColorClass.replace('bg-', 'border-')}`;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            modal.classList.add('hidden');
            modalContent.classList.replace('scale-100', 'scale-95');
        }

        // 앱 실행
        initApp();
    </script>
</body>
</html>
